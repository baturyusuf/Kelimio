name: Apply backend test fixes (temporary)

on:
  push:
    branches: ["agent/google-play-internal-mvp"]
    paths: [".github/workflows/apply-backend-fixes-temp.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/google-play-internal-mvp
          persist-credentials: true
          fetch-depth: 0
      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/patch-parts/backend-fixes.b64 | gzip -d > /tmp/backend-fixes.patch
          git apply --index --whitespace=error /tmp/backend-fixes.patch
          rm -rf .github/patch-parts .github/workflows/apply-backend-fixes-temp.yml
          git add -A
          git config user.name "baturyusuf"
          git config user.email "75681771+baturyusuf@users.noreply.github.com"
          git commit -m "Fix internal MVP backend migrations and tests"
          git push origin HEAD:agent/google-play-internal-mvp
