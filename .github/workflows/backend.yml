name: Backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Verify backend
        working-directory: backend
        run: ./gradlew --no-daemon clean check
      - name: Build runtime image
        working-directory: backend
        run: docker build --target runtime --tag kelimio-api:${{ github.sha }} .
      - name: Verify non-root Fargate scratch volume
        run: |
          set -euo pipefail
          volume="kelimio-api-tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker volume rm "$volume" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run --rm --read-only \
            --mount "type=volume,source=$volume,target=/tmp" \
            --entrypoint /bin/sh \
            kelimio-api:${{ github.sha }} \
            -ec 'test "$(id -u)" -ne 0; touch /tmp/kelimio-write-probe; test ! -w /app'
          docker image inspect kelimio-api:${{ github.sha }} \
            --format '{{ json .Config.Volumes }}' | grep -F '"/tmp"'
      - name: Gate runtime image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: kelimio-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Generate runtime image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: kelimio-api:${{ github.sha }}
          format: cyclonedx
          output: kelimio-api.cdx.json
          exit-code: "0"
      - name: Retain runtime image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kelimio-api-sbom-${{ github.sha }}
          path: kelimio-api.cdx.json
          if-no-files-found: error
          retention-days: 30
