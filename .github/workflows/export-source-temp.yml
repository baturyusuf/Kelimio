name: Export source snapshot (temporary)

on:
  pull_request:
    paths:
      - ".github/workflows/export-source-temp.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Create source archive
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.github/workflows/export-source-temp.yml -czf /tmp/kelimio-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kelimio-source-${{ github.sha }}
          path: /tmp/kelimio-source.tar.gz
          if-no-files-found: error
          retention-days: 1
