name: Apply internal MVP backend patch (temporary)

on:
  push:
    branches: ["agent/google-play-internal-mvp"]
    paths: [".github/workflows/export-source-temp.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/google-play-internal-mvp
          persist-credentials: true
          fetch-depth: 0
      - name: Apply reviewed backend patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patch-parts/backend-*.b64 | base64 --decode | gzip -d > /tmp/backend.patch
          git apply --index --whitespace=error /tmp/backend.patch
          rm -rf .github/patch-parts .github/workflows/export-source-temp.yml
          git add -A
          git config user.name "baturyusuf"
          git config user.email "75681771+baturyusuf@users.noreply.github.com"
          git commit -m "Expand internal MVP backend"
          git push origin HEAD:agent/google-play-internal-mvp
