name: Backend diagnostic (temporary)

on:
  push:
    branches: ["agent/google-play-internal-mvp"]
    paths: [".github/workflows/backend-diagnostic-temp.yml"]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/google-play-internal-mvp
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Capture backend verification log
        working-directory: backend
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon clean check --stacktrace --info > ../backend-diagnostic.log 2>&1
          status=$?
          printf '%s\n' "$status" > ../backend-diagnostic.exit
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-diagnostic-${{ github.sha }}
          path: |
            backend-diagnostic.log
            backend-diagnostic.exit
          if-no-files-found: error
          retention-days: 1
