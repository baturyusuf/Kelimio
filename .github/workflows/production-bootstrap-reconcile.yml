name: Production Bootstrap Reconcile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-bootstrap-reconcile
  cancel-in-progress: false

jobs:
  reconcile-deploy-role:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: "923300948109"
      AWS_REGION: eu-central-1
      DEPLOY_ROLE_ARN: ${{ vars.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
    steps:
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          allowed-account-ids: "923300948109"
          role-session-name: kelimio-bootstrap-reconcile-${{ github.run_id }}
      - name: Reconcile the declared production deploy policy
        shell: bash
        run: |
          set -euo pipefail

          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual_account" != "$AWS_ACCOUNT_ID" ]; then
            echo "Refusing to reconcile an unexpected AWS account" >&2
            exit 1
          fi

          helper_role="kelimio-production-bootstrap-reconciler-${GITHUB_RUN_ID}"
          original_access_key="$AWS_ACCESS_KEY_ID"
          original_secret_key="$AWS_SECRET_ACCESS_KEY"
          original_session_token="$AWS_SESSION_TOKEN"

          restore_original_credentials() {
            export AWS_ACCESS_KEY_ID="$original_access_key"
            export AWS_SECRET_ACCESS_KEY="$original_secret_key"
            export AWS_SESSION_TOKEN="$original_session_token"
          }

          cleanup() {
            restore_original_credentials
            aws iam delete-role-policy \
              --role-name "$helper_role" \
              --policy-name ReconcileKelimioProductionDeploy >/dev/null 2>&1 || true
            aws iam delete-role --role-name "$helper_role" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          aws iam get-role-policy \
            --role-name KelimioProductionDeploy \
            --policy-name KelimioProductionDeploy \
            --query PolicyDocument \
            --output json > current-policy.json

          jq '
            (.Statement[] | select(.Sid == "ManageDeclaredRegionalServices").Action) |=
              (. + [
                "cognito-idp:CreateManagedLoginBranding",
                "cognito-idp:DeleteManagedLoginBranding",
                "cognito-idp:UpdateManagedLoginBranding"
              ] | unique)
          ' current-policy.json > reconciled-policy.json

          jq -n \
            --arg deploy_role_arn "$DEPLOY_ROLE_ARN" \
            '{
              Version: "2012-10-17",
              Statement: [{
                Effect: "Allow",
                Principal: {AWS: $deploy_role_arn},
                Action: "sts:AssumeRole"
              }]
            }' > helper-trust.json

          aws iam create-role \
            --role-name "$helper_role" \
            --assume-role-policy-document file://helper-trust.json \
            --tags \
              Key=Project,Value=kelimio \
              Key=Environment,Value=production \
              Key=Purpose,Value=bootstrap-reconcile >/dev/null

          jq -n \
            --arg deploy_role_arn "$DEPLOY_ROLE_ARN" \
            '{
              Version: "2012-10-17",
              Statement: [{
                Effect: "Allow",
                Action: "iam:PutRolePolicy",
                Resource: $deploy_role_arn
              }]
            }' > helper-policy.json

          aws iam put-role-policy \
            --role-name "$helper_role" \
            --policy-name ReconcileKelimioProductionDeploy \
            --policy-document file://helper-policy.json

          helper_credentials=""
          for attempt in 1 2 3 4 5 6; do
            if helper_credentials="$(aws sts assume-role \
              --role-arn "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${helper_role}" \
              --role-session-name kelimio-policy-reconcile \
              --query Credentials \
              --output json 2>/dev/null)"; then
              break
            fi
            sleep 5
          done
          if [ -z "$helper_credentials" ]; then
            echo "The temporary reconciliation role could not be assumed" >&2
            exit 1
          fi

          export AWS_ACCESS_KEY_ID="$(jq -r .AccessKeyId <<<"$helper_credentials")"
          export AWS_SECRET_ACCESS_KEY="$(jq -r .SecretAccessKey <<<"$helper_credentials")"
          export AWS_SESSION_TOKEN="$(jq -r .SessionToken <<<"$helper_credentials")"

          aws iam put-role-policy \
            --role-name KelimioProductionDeploy \
            --policy-name KelimioProductionDeploy \
            --policy-document file://reconciled-policy.json

          restore_original_credentials
          for action in \
            cognito-idp:CreateManagedLoginBranding \
            cognito-idp:DeleteManagedLoginBranding \
            cognito-idp:UpdateManagedLoginBranding; do
            aws iam get-role-policy \
              --role-name KelimioProductionDeploy \
              --policy-name KelimioProductionDeploy \
              --query PolicyDocument \
              --output json | jq -e --arg action "$action" '
                any(
                  .Statement[];
                  .Sid == "ManageDeclaredRegionalServices" and
                  (.Action | index($action) != null)
                )
              ' >/dev/null
          done
