name: Export expanded MVP recovery snapshot

on:
  push:
    branches: ["agent/google-play-internal-mvp"]
    paths: [".github/workflows/export-expanded-recovery-temp.yml"]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/google-play-internal-mvp
          persist-credentials: false
          fetch-depth: 1
      - name: Create recovery archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.github/workflows/export-expanded-recovery-temp.yml \
            -czf /tmp/kelimio-expanded-mvp-source.tar.gz .
      - name: Upload recovery archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kelimio-expanded-mvp-source-${{ github.sha }}
          path: /tmp/kelimio-expanded-mvp-source.tar.gz
          if-no-files-found: error
          retention-days: 1
