name: Apply expanded internal MVP (temporary)

on:
  push:
    branches: ["agent/google-play-internal-mvp"]
    paths: [".github/workflows/apply-expanded-mvp-temp.yml"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/google-play-internal-mvp
          persist-credentials: false
          fetch-depth: 0
      - name: Capture patch applicability
        shell: bash
        run: |
          set +e
          base64 --decode .github/patch-parts/expanded-mobile-infra.b64 | gzip -d > /tmp/expanded.patch
          git apply --check --verbose /tmp/expanded.patch > /tmp/expanded-apply.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/expanded-apply.exit
          cat /tmp/expanded-apply.log
          exit 0
      - name: Upload patch diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expanded-mvp-patch-diagnostic-${{ github.sha }}
          path: |
            /tmp/expanded-apply.log
            /tmp/expanded-apply.exit
            /tmp/expanded.patch
          if-no-files-found: error
          retention-days: 1
