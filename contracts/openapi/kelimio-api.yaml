          format: date-time
    QuestionPayload:
      type: object
      additionalProperties: false
      x-kelimio-test-nullable-matching-prompt: true
      description: >-
        Answer-key-free online question payload. MULTIPLE_CHOICE_CLOZE and
        TYPED_CLOZE carry a raw target-language sentence and exactly one literal
        ASCII --- marker; the client renders that marker as an accessible
        visual blank. MATCHING has a null prompt, no options, and independently
        ordered target/support item arrays with no field linking the two sides.
      x-kelimio-cross-field-invariants:
        - MULTIPLE_CHOICE_CLOZE and TYPED_CLOZE prompts contain exactly one literal ASCII ---; overlapping occurrences count.
        - WORD_MULTIPLE_CHOICE and MULTIPLE_CHOICE_CLOZE contain exactly four options; TYPED_CLOZE and MATCHING contain none.
        - MATCHING contains two through six target items and the same number of support items; all item IDs are unique per side and the two ID sets are disjoint.
        - Non-MATCHING questions contain no target or support items.
      required: [questionId, questionRevisionId, type, position, prompt, options, targetItems, supportItems]
      allOf:
        - if:
            properties:
              type:
                enum: [MULTIPLE_CHOICE_CLOZE, TYPED_CLOZE]
            required: [type]
          then:
            properties:
              prompt:
                pattern: '^(?![\s\S]*----)(?![\s\S]*---[\s\S]*---)[\s\S]*---[\s\S]*$'
        - if:
            properties:
              type:
                enum: [WORD_MULTIPLE_CHOICE, MULTIPLE_CHOICE_CLOZE]
            required: [type]
          then:
            properties:
              options:
                minItems: 4
                maxItems: 4
          else:
            properties:
              options:
                maxItems: 0
        - if:
            properties:
              type:
                const: MATCHING
            required: [type]
          then:
            allOf:
              - properties:
                  prompt:
                    type: "null"
              - oneOf:
                  - properties:
                      targetItems: { minItems: 2, maxItems: 2 }
                      supportItems: { minItems: 2, maxItems: 2 }
                  - properties:
                      targetItems: { minItems: 3, maxItems: 3 }
                      supportItems: { minItems: 3, maxItems: 3 }
                  - properties:
                      targetItems: { minItems: 4, maxItems: 4 }
                      supportItems: { minItems: 4, maxItems: 4 }
                  - properties:
                      targetItems: { minItems: 5, maxItems: 5 }
                      supportItems: { minItems: 5, maxItems: 5 }
                  - properties:
                      targetItems: { minItems: 6, maxItems: 6 }
                      supportItems: { minItems: 6, maxItems: 6 }
          else:
            properties:
              prompt:
                type: string
                minLength: 1
                maxLength: 1000
              targetItems:
                maxItems: 0
              supportItems:
                maxItems: 0
      properties:
        questionId:
          $ref: "#/components/schemas/Id"
        questionRevisionId:
          $ref: "#/components/schemas/Id"
        type:
          type: string
          enum: [WORD_MULTIPLE_CHOICE, MULTIPLE_CHOICE_CLOZE, TYPED_CLOZE, MATCHING]
        position:
          type: integer
          minimum: 1
        prompt:
          $ref: "#/components/schemas/QuestionPrompt"
          x-kelimio-required-nullable: true
        options:
          type: array
          items:
            $ref: "#/components/schemas/AnswerOption"
        targetItems:
          type: array
          items:
            $ref: "#/components/schemas/MatchingItem"
        supportItems:
          type: array
          items:
            $ref: "#/components/schemas/MatchingItem"
    AnswerOption:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        text:
          type: string
          minLength: 1
          maxLength: 500
    MatchingItem:
