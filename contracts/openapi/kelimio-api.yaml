openapi: 3.1.0
info:
  title: Kelimio API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Versioned contract for the Kelimio mobile and administrative clients. Server
    state is authoritative for identity, answers, score, energy, progress, and
    entitlements.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Base URL supplied by the environment-specific client configuration.
x-kelimio-operating-modes:
  source: server-authoritative
  modes:
    NORMAL:
      effect: All otherwise-authorized operations are available.
    CONSERVE:
      effect: Course import, authoring, and release mutations return a no-store 503 problem.
      problemType: cost-conservation
    READ_ONLY:
      effect: Unsafe HTTP methods return a no-store 503 problem before any domain mutation.
      problemType: cost-read-only
    SUSPENDED:
      effect: Every /v1 operation returns a no-store 503 problem; health remains available while compute is draining.
      problemType: cost-suspended
tags:
  - name: Profile
    description: Authenticated profile and language preferences.
  - name: Catalog
    description: Published course discovery and details.
  - name: Enrollment
    description: Contextual learner access to courses.
  - name: Learning
    description: Authoritative online attempts and answer evaluation.
  - name: Energy
    description: Free-course energy state managed by the server.
  - name: Course Import
    description: Owner-scoped XLSX intake, isolated validation preview, and provenance-bound approval.
  - name: Course Release
    description: Owner-scoped impact review, publication, and rollback of immutable course releases.
  - name: Teacher
    description: Production teacher eligibility and versioned authoring-terms acceptance.
  - name: Social
    description: Private-by-default public profiles and explicitly opted-in rankings.
  - name: Account
    description: Owner-scoped export, deletion, consent, and notification controls.
  - name: Development
    description: Explicit local/test utilities that are unavailable outside enabled non-production environments.
security:
  - bearerAuth: []
paths:
  /v1/me:
    get:
      operationId: getMe
      tags: [Profile]
      summary: Return the authenticated user's profile and language preferences
      responses:
        "200":
          description: Authenticated profile
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/profile-setup:
    post:
      operationId: completeProfileSetup
      tags: [Profile]
      summary: Complete the authenticated user's first-login profile setup
      description: >-
        Completes the provisional subject-bound profile exactly once. Repeating
        the same Idempotency-Key and canonical request returns the original
        result without duplicate facts. This is not legal-terms acceptance,
        and identity-provider subject, email, and username are neither accepted
        by this command nor exposed by the profile response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSetupRequest"
      responses:
        "200":
          description: Completed authenticated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/catalog/courses:
    get:
      operationId: listCatalogCourses
      tags: [Catalog]
      summary: List public, published courses
      parameters:
        - $ref: "#/components/parameters/ClientCapabilities"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: targetLanguage
          in: query
          schema:
            $ref: "#/components/schemas/LanguageTag"
        - name: supportLanguage
          in: query
          schema:
            $ref: "#/components/schemas/LanguageTag"
        - name: q
          in: query
          description: Case-insensitive course name or description search.
          schema:
            type: string
            minLength: 2
            maxLength: 80
        - name: accessType
          in: query
          schema:
            type: string
            enum: [FREE, PAID]
      responses:
        "200":
          description: A cursor page of courses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePage"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/{courseId}:
    get:
      operationId: getCourse
      tags: [Catalog]
      summary: Return course details visible to the authenticated user
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ClientCapabilities"
      responses:
        "200":
          description: Course details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/{courseId}/progress:
    get:
      operationId: getCourseProgress
      tags: [Learning]
      summary: Return the authenticated learner's rebuildable course progress projection
      description: >-
        Counts and scores are projected only from server-authoritative PostgreSQL
        facts. When updating is true, the last completed projection is returned
        while unresolved outbox facts remain, including a delivery awaiting
        operational replay after exhausting worker retries. Clients must use
        bounded polling and expose a retry state instead of an endless spinner.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Current course progress projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseProgressResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/{courseId}/enrollments:
    post:
      operationId: enrollInCourse
      tags: [Enrollment]
      summary: Enroll the authenticated user in a free public course
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ClientCapabilities"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnrollmentRequest"
      responses:
        "201":
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "200":
          description: Existing enrollment returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/tests/{testId}/attempts:
    post:
      operationId: startAttempt
      tags: [Learning]
      summary: Start an online attempt for the current test revision
      parameters:
        - name: testId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ClientCapabilities"
      responses:
        "201":
          description: Attempt created; answer keys are deliberately absent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/attempts/{attemptId}/answers:
    post:
      operationId: submitAnswer
      tags: [Learning]
      summary: Record and evaluate one online answer exactly once
      description: >-
        Reusing submissionId returns the previously committed response and never
        creates a second attempt fact, score event, energy event, or outbox event.
        The complete request body is limited to 8192 bytes and is rejected before
        JSON allocation or transactional command handling when that limit is exceeded.
      x-kelimio-max-request-body-bytes: 8192
      parameters:
        - $ref: "#/components/parameters/AttemptId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ClientCapabilities"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
      responses:
        "200":
          description: Authoritative evaluation and resulting server state
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerRecordedResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          description: Request body exceeds the answer-submission byte limit
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/attempts/{attemptId}/answers/{submissionId}:
    get:
      operationId: getRecordedAnswer
      tags: [Learning]
      summary: Reconcile one previously committed answer owned by the current user
      description: >-
        Returns the immutable committed result only when both the attempt and
        submission belong to the authenticated user. Missing or non-owned
        records are indistinguishable and return not found.
      parameters:
        - $ref: "#/components/parameters/AttemptId"
        - name: submissionId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - $ref: "#/components/parameters/ClientCapabilities"
      responses:
        "200":
          description: Previously committed authoritative answer result
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerRecordedResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/attempts/{attemptId}/finish:
    post:
      operationId: finishAttempt
      tags: [Learning]
      summary: Finish an attempt after all planned questions are answered
      parameters:
        - $ref: "#/components/parameters/AttemptId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ClientCapabilities"
      responses:
        "200":
          description: Final attempt result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinishAttemptResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/energy:
    get:
      operationId: getEnergy
      tags: [Energy]
      summary: Return the lazily regenerated free-course energy account
      responses:
        "200":
          description: Current energy state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnergyResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/imports:
    get:
      operationId: listCourseImports
      tags: [Course Import]
      summary: Page through the current user's import sessions
      description: >-
        Returns newest-first owner-scoped import states for process-death
        discovery. The HMAC-bound cursor contains no workbook content or
        storage identity. Missing and non-owned imports remain undisclosed.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: One newest-first page of owner import states
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportStatusPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCourseImport
      x-kelimio-max-request-body-bytes: 8192
      tags: [Course Import]
      summary: Create an owner-scoped resumable XLSX upload session
      description: >-
        Creates one bounded S3 multipart upload for an untrusted XLSX. The API
        never receives or parses workbook bytes. The whole-file and per-part
        digests are client assertions that the isolated worker recomputes or
        verifies before any scan, preview, archive, or approval can succeed.
        The JSON command body is rejected before parsing when it exceeds 8192
        bytes; workbook bytes travel only through the bounded direct upload.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseImportRequest"
      responses:
        "201":
          description: Import and resumable upload instructions created
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportUploadSessionResponse"
        "200":
          description: Existing import returned for an idempotent retry
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportUploadSessionResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/imports/{importId}:
    get:
      operationId: getCourseImport
      tags: [Course Import]
      summary: Return the current owner-scoped import state
      description: >-
        Missing and non-owned imports are indistinguishable. Storage keys,
        object versions, upload IDs, scanner internals, and raw failures are
        deliberately absent.
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: Current import state and immutable preview summary, when available
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportStatusResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/imports/{importId}/complete:
    post:
      operationId: completeCourseImportUpload
      x-kelimio-max-request-body-bytes: 8192
      tags: [Course Import]
      summary: Complete the exact multipart object and queue isolated processing
      description: >-
        Completes only the server-created multipart upload with its exact
        consecutive part list. A successful command records one non-null S3
        VersionId and transactional outbox event. It does not claim that the
        workbook is clean, valid, archived, approved, or committed.
        The JSON completion command is rejected before parsing when it exceeds
        8192 bytes.
      parameters:
        - $ref: "#/components/parameters/ImportId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteCourseImportUploadRequest"
      responses:
        "202":
          description: Exact object version accepted and processing queued
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportStatusResponse"
        "200":
          description: Existing queued or later result returned for an idempotent retry
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportStatusResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/imports/{importId}/preview:
    get:
      operationId: listCourseImportPreviewRows
      tags: [Course Import]
      summary: Page through the immutable normalized owner preview
      parameters:
        - $ref: "#/components/parameters/ImportId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One immutable page from the isolated parser result
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportPreviewPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/imports/{importId}/issues:
    get:
      operationId: listCourseImportValidationIssues
      tags: [Course Import]
      summary: Page through the immutable owner-scoped validation report
      parameters:
        - $ref: "#/components/parameters/ImportId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One immutable validation-report page
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportIssuePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/imports/{importId}/approve:
    post:
      operationId: approveCourseImport
      x-kelimio-max-request-body-bytes: 8192
      tags: [Course Import]
      summary: Approve one exact immutable preview and provenance tuple
      description: >-
        Appends owner approval only when the supplied binding digest matches the
        current PREVIEW_READY fact. Approval creates no course, revision,
        release, entitlement, or publication side effect.
        The JSON approval command is rejected before parsing when it exceeds
        8192 bytes.
      parameters:
        - $ref: "#/components/parameters/ImportId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveCourseImportRequest"
      responses:
        "201":
          description: Approval fact appended
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportApprovalResponse"
        "200":
          description: Existing approval returned for an idempotent retry
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportApprovalResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/imports/{importId}/commit:
    post:
      operationId: commitCourseImport
      x-kelimio-max-request-body-bytes: 8192
      tags: [Course Import]
      summary: Commit one approved preview as an unpublished immutable course draft
      description: >-
        Commits only the exact approved import provenance and versioned
        import-content-v1 preview. The transaction creates a DRAFT course with
        no active release, one committed content change set, and one immutable
        DRAFT release hierarchy. It does not activate or publish a release,
        expose the course in the catalog, enroll a learner, or grant an
        entitlement. Legacy approvals without the versioned settings payload
        remain approval-only. The JSON command body is rejected before parsing
        when it exceeds 8192 bytes.
      parameters:
        - $ref: "#/components/parameters/ImportId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitCourseImportRequest"
      responses:
        "201":
          description: Unpublished immutable draft created
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportCommitResponse"
        "200":
          description: Existing draft result returned for an idempotent retry
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportCommitResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/{courseId}/releases/{releaseId}/impact:
    get:
      operationId: getCourseReleaseImpact
      tags: [Course Release]
      summary: Review the exact owner-scoped impact of activating an immutable release
      description: >-
        Returns a canonical binding digest over the locked release manifests and
        current active release. The enrollment count is advisory and deliberately
        excluded from the binding because projection membership is cutoff-bound at activation.
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ReleaseId"
      responses:
        "200":
          description: Release activation impact
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseReleaseImpactResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/{courseId}/releases/{releaseId}/activate:
    post:
      operationId: activateCourseRelease
      tags: [Course Release]
      summary: Publish or roll back to an exact reviewed immutable release
      description: >-
        Atomically activates the reviewed release, appends the activation and
        outbox facts, and creates a cutoff-bound progress reprojection job.
        In production this endpoint additionally requires the server-side teacher
        feature gate, Cognito teacher-group eligibility, and current versioned
        authoring-terms acceptance.
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ReleaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateCourseReleaseRequest"
      responses:
        "201":
          description: Release activation created
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseReleaseActivationResponse"
        "200":
          description: Existing activation returned for an idempotent retry
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseReleaseActivationResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/teacher/access:
    get:
      operationId: getTeacherAccess
      tags: [Teacher]
      summary: Return the authenticated user's production teacher access state
      description: >-
        Reports server-authoritative feature enablement, Cognito group eligibility,
        and current versioned terms acceptance. A client flag never grants access.
      responses:
        "200":
          description: Current teacher access state
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
