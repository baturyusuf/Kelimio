openapi: 3.1.0
info:
  title: Kelimio API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Versioned contract for the Kelimio mobile and administrative clients. Server
    state is authoritative for identity, answers, score, energy, progress, and
    entitlements.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Base URL supplied by the environment-specific client configuration.
tags:
  - name: Profile
    description: Authenticated profile and language preferences.
  - name: Catalog
    description: Published course discovery and details.
  - name: Enrollment
    description: Contextual learner access to courses.
  - name: Learning
    description: Authoritative online attempts and answer evaluation.
  - name: Energy
    description: Free-course energy state managed by the server.
  - name: Development
    description: Explicit local-only utilities that are unavailable outside the local environment.
security:
  - bearerAuth: []
paths:
  /v1/me:
    get:
      operationId: getMe
      tags: [Profile]
      summary: Return the authenticated user's profile and language preferences
      responses:
        "200":
          description: Authenticated profile
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/profile-setup:
    post:
      operationId: completeProfileSetup
      tags: [Profile]
      summary: Complete the authenticated user's first-login profile setup
      description: >-
        Completes the provisional subject-bound profile exactly once. Repeating
        the same Idempotency-Key and canonical request returns the original
        result without duplicate facts. This is not legal-terms acceptance,
        and identity-provider subject, email, and username are neither accepted
        by this command nor exposed by the profile response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSetupRequest"
      responses:
        "200":
          description: Completed authenticated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/catalog/courses:
    get:
      operationId: listCatalogCourses
      tags: [Catalog]
      summary: List public, published courses
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: targetLanguage
          in: query
          schema:
            $ref: "#/components/schemas/LanguageTag"
        - name: supportLanguage
          in: query
          schema:
            $ref: "#/components/schemas/LanguageTag"
      responses:
        "200":
          description: A cursor page of courses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePage"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/{courseId}:
    get:
      operationId: getCourse
      tags: [Catalog]
      summary: Return course details visible to the authenticated user
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Course details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/{courseId}/progress:
    get:
      operationId: getCourseProgress
      tags: [Learning]
      summary: Return the authenticated learner's rebuildable course progress projection
      description: >-
        Counts and scores are projected only from server-authoritative PostgreSQL
        facts. When updating is true, the last completed projection is returned
        while unresolved outbox facts remain, including a delivery awaiting
        operational replay after exhausting worker retries. Clients must use
        bounded polling and expose a retry state instead of an endless spinner.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Current course progress projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseProgressResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/courses/{courseId}/enrollments:
    post:
      operationId: enrollInCourse
      tags: [Enrollment]
      summary: Enroll the authenticated user in a free public course
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnrollmentRequest"
      responses:
        "201":
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "200":
          description: Existing enrollment returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/tests/{testId}/attempts:
    post:
      operationId: startAttempt
      tags: [Learning]
      summary: Start an online attempt for the current test revision
      parameters:
        - name: testId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Attempt created; answer keys are deliberately absent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/attempts/{attemptId}/answers:
    post:
      operationId: submitAnswer
      tags: [Learning]
      summary: Record and evaluate one online answer exactly once
      description: >-
        Reusing submissionId returns the previously committed response and never
        creates a second attempt fact, score event, energy event, or outbox event.
      parameters:
        - $ref: "#/components/parameters/AttemptId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
      responses:
        "200":
          description: Authoritative evaluation and resulting server state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerRecordedResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/attempts/{attemptId}/finish:
    post:
      operationId: finishAttempt
      tags: [Learning]
      summary: Finish an attempt after all planned questions are answered
      parameters:
        - $ref: "#/components/parameters/AttemptId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Final attempt result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinishAttemptResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/energy:
    get:
      operationId: getEnergy
      tags: [Energy]
      summary: Return the lazily regenerated free-course energy account
      responses:
        "200":
          description: Current energy state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnergyResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/development/starter-course:
    post:
      operationId: installLocalStarterCourse
      tags: [Development]
      summary: Install the authenticated owner's local starter course idempotently
      description: >-
        Available only when the backend is explicitly running in the local
        environment with starter-course installation enabled. It creates one
        immutable Type-A English-support release derived from the reviewed
        workbook subset and never creates users or learning results.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Starter course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalStarterCourseResponse"
        "200":
          description: Existing starter course returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalStarterCourseResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token obtained with Authorization Code and PKCE.
  headers:
    RequestId:
      description: Correlation identifier generated or accepted by the API edge.
      schema:
        type: string
        format: uuid
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable UUID generated once for the logical command.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Id:
      type: string
      format: uuid
    LanguageTag:
      type: string
      description: >-
        Canonically cased BCP 47 subset: lowercase primary language, optional
        title-case script, uppercase region, and lowercase variants. Extensions
        and private-use subtags are outside the initial API contract.
      minLength: 2
      maxLength: 35
      pattern: "^[a-z]{2,8}(?:-[A-Z][a-z]{3})?(?:-(?:[A-Z]{2}|[0-9]{3}))?(?:-(?:[a-z0-9]{5,8}|[0-9][a-z0-9]{3}))*$"
      examples: [tr, en, ar, fr, pt-BR, zh-Hant]
    MeResponse:
      type: object
      additionalProperties: false
      x-kelimio-cross-field-invariants:
        - REQUIRED means profileVersion is 0 and preferredSupportLanguage is absent or null.
        - COMPLETE means profileVersion is at least 1 and preferredSupportLanguage is non-null.
      required:
        - id
        - displayName
        - appLocale
        - activeTargetLanguage
        - timeZone
        - profileVersion
        - profileSetupStatus
      properties:
        id:
          $ref: "#/components/schemas/Id"
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        appLocale:
          $ref: "#/components/schemas/LanguageTag"
        activeTargetLanguage:
          $ref: "#/components/schemas/LanguageTag"
        preferredSupportLanguage:
          type: [string, "null"]
          description: Absent or null until first-login profile setup is complete.
          minLength: 2
          maxLength: 35
          pattern: "^[a-z]{2,8}(?:-[A-Z][a-z]{3})?(?:-(?:[A-Z]{2}|[0-9]{3}))?(?:-(?:[a-z0-9]{5,8}|[0-9][a-z0-9]{3}))*$"
        timeZone:
          $ref: "#/components/schemas/TimeZoneId"
        profileVersion:
          type: integer
          format: int64
          minimum: 0
        profileSetupStatus:
          type: string
          description: >-
            REQUIRED pairs with profileVersion 0 and no support language;
            COMPLETE pairs with profileVersion at least 1 and a support language.
          enum: [REQUIRED, COMPLETE]
    ProfileSetupRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
        - appLocale
        - activeTargetLanguage
        - preferredSupportLanguage
        - timeZone
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        appLocale:
          type: string
          enum: [tr, en, ar]
        activeTargetLanguage:
          $ref: "#/components/schemas/LanguageTag"
        preferredSupportLanguage:
          $ref: "#/components/schemas/LanguageTag"
        timeZone:
          $ref: "#/components/schemas/TimeZoneId"
    TimeZoneId:
      type: string
      description: >-
        Named IANA time-zone identifier accepted by the backend runtime, or UTC.
        Raw numeric offsets and GMT-prefixed fixed offsets are rejected.
      minLength: 1
      maxLength: 64
      examples: [Europe/Istanbul, UTC]
    CourseSummary:
      type: object
      additionalProperties: false
      required:
        [id, name, targetLanguage, supportLanguages, accessType, visibility, enrolled]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: [string, "null"]
          maxLength: 2000
        targetLanguage:
          $ref: "#/components/schemas/LanguageTag"
        supportLanguages:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LanguageTag"
        accessType:
          type: string
          enum: [FREE, PAID]
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
        enrolled:
          type: boolean
    CourseDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - targetLanguage
        - supportLanguages
        - accessType
        - visibility
        - enrolled
        - ownerDisplayName
        - releaseId
        - tests
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: [string, "null"]
          maxLength: 2000
        targetLanguage:
          $ref: "#/components/schemas/LanguageTag"
        supportLanguages:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LanguageTag"
        accessType:
          type: string
          enum: [FREE, PAID]
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
        enrolled:
          type: boolean
        ownerDisplayName:
          type: string
          maxLength: 80
        releaseId:
          $ref: "#/components/schemas/Id"
        tests:
          type: array
          items:
            $ref: "#/components/schemas/TestSummary"
    CourseProgressResponse:
      type: object
      additionalProperties: false
      required:
        - courseId
        - answeredQuestions
        - correctAnswers
        - completedAttempts
        - passedAttempts
        - activeScore
        - lifetimeScore
        - projectionVersion
        - updating
        - updatedAt
      properties:
        courseId:
          $ref: "#/components/schemas/Id"
        answeredQuestions:
          type: integer
          minimum: 0
        correctAnswers:
          type: integer
          minimum: 0
        completedAttempts:
          type: integer
          minimum: 0
        passedAttempts:
          type: integer
          minimum: 0
        activeScore:
          type: integer
          format: int64
          minimum: 0
        lifetimeScore:
          type: integer
          format: int64
          minimum: 0
        projectionVersion:
          type: integer
          format: int64
          minimum: 0
        updating:
          type: boolean
        updatedAt:
          type: [string, "null"]
          format: date-time
    TestSummary:
      type: object
      additionalProperties: false
      required: [id, revisionId, name, position, questionCount]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        revisionId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          maxLength: 160
        position:
          type: integer
          minimum: 1
        questionCount:
          type: integer
          minimum: 1
    CoursePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CourseSummary"
        nextCursor:
          type: [string, "null"]
    CreateEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [supportLanguage]
      properties:
        supportLanguage:
          $ref: "#/components/schemas/LanguageTag"
    EnrollmentResponse:
      type: object
      additionalProperties: false
      required: [id, courseId, supportLanguage, status, enrolledAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        courseId:
          $ref: "#/components/schemas/Id"
        supportLanguage:
          $ref: "#/components/schemas/LanguageTag"
        status:
          type: string
          enum: [ACTIVE]
        enrolledAt:
          type: string
          format: date-time
    AttemptResponse:
      type: object
      additionalProperties: false
      required: [id, testId, testRevisionId, state, questions, startedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        testId:
          $ref: "#/components/schemas/Id"
        testRevisionId:
          $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/AttemptState"
        questions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QuestionPayload"
        startedAt:
          type: string
          format: date-time
    QuestionPayload:
      type: object
      additionalProperties: false
      description: >-
        Answer-key-free online question payload. MULTIPLE_CHOICE_CLOZE carries
        the raw target-language sentence and exactly one literal ASCII ---
        marker; the client renders that marker as an accessible visual blank.
      x-kelimio-cross-field-invariants:
        - MULTIPLE_CHOICE_CLOZE prompt contains exactly one literal ASCII ---; overlapping occurrences count.
      required: [questionId, questionRevisionId, type, position, prompt, options]
      allOf:
        - if:
            properties:
              type:
                const: MULTIPLE_CHOICE_CLOZE
            required: [type]
          then:
            properties:
              prompt:
                pattern: '^(?![\s\S]*----)(?![\s\S]*---[\s\S]*---)[\s\S]*---[\s\S]*$'
      properties:
        questionId:
          $ref: "#/components/schemas/Id"
        questionRevisionId:
          $ref: "#/components/schemas/Id"
        type:
          type: string
          enum: [WORD_MULTIPLE_CHOICE, MULTIPLE_CHOICE_CLOZE]
        position:
          type: integer
          minimum: 1
        prompt:
          type: string
          minLength: 1
          maxLength: 1000
        options:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/AnswerOption"
    AnswerOption:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        text:
          type: string
          minLength: 1
          maxLength: 500
    SubmitAnswerRequest:
      type: object
      additionalProperties: false
      required: [submissionId, questionRevisionId, selectedOptionId]
      properties:
        submissionId:
          $ref: "#/components/schemas/Id"
        questionRevisionId:
          $ref: "#/components/schemas/Id"
        selectedOptionId:
          $ref: "#/components/schemas/Id"
    AnswerRecordedResponse:
      type: object
      additionalProperties: false
      required:
        - submissionId
        - correct
        - correctOptionId
        - activeScoreDelta
        - lifetimeScoreDelta
        - activeQuestionScore
        - lifetimeScore
        - energy
        - attemptState
      properties:
        submissionId:
          $ref: "#/components/schemas/Id"
        correct:
          type: boolean
        correctOptionId:
          $ref: "#/components/schemas/Id"
        activeScoreDelta:
          type: integer
          minimum: 0
          maximum: 60
        lifetimeScoreDelta:
          type: integer
          minimum: 0
          maximum: 60
        activeQuestionScore:
          type: integer
          minimum: 0
          maximum: 60
        lifetimeScore:
          type: integer
          minimum: 0
        energy:
          $ref: "#/components/schemas/EnergyResponse"
        attemptState:
          $ref: "#/components/schemas/AttemptState"
    FinishAttemptResponse:
      type: object
      additionalProperties: false
      required: [attemptId, state, correctCount, questionCount, correctRatio, completedAt]
      properties:
        attemptId:
          $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/AttemptState"
        correctCount:
          type: integer
          minimum: 0
        questionCount:
          type: integer
          minimum: 1
        correctRatio:
          type: number
          minimum: 0
          maximum: 1
        completedAt:
          type: string
          format: date-time
    AttemptState:
      type: string
      enum: [IN_PROGRESS, COMPLETED_PASS, COMPLETED_FAIL, INTERRUPTED_ENERGY]
    EnergyResponse:
      type: object
      additionalProperties: false
      required: [balance, maximum, unlimited, asOf]
      properties:
        balance:
          type: integer
          minimum: 0
          maximum: 5
        maximum:
          type: integer
          const: 5
        unlimited:
          type: boolean
        nextRegenerationAt:
          type: [string, "null"]
          format: date-time
        asOf:
          type: string
          format: date-time
    LocalStarterCourseResponse:
      type: object
      additionalProperties: false
      required: [courseId, created, sourceWorkbookSha256]
      properties:
        courseId:
          $ref: "#/components/schemas/Id"
        created:
          type: boolean
        sourceWorkbookSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        requestId:
          type: string
