    SubmitAnswerRequest:
      type: object
      additionalProperties: false
      description: >-
        Carries exactly one answer form. typedAnswer and matches are sensitive,
        are evaluated only by the server, and must never be logged or emitted
        to analytics or outbox events.
      x-kelimio-cross-field-invariants:
        - Exactly one of selectedOptionId, typedAnswer, and matches is present.
        - matches is a complete bijection over the server-issued matching item IDs, with no duplicate target or support ID.
      x-kelimio-redacted-to-string: true
      x-kelimio-redaction-test-submit-answer-request: true
      required: [submissionId, questionRevisionId]
      oneOf:
        - required: [selectedOptionId]
          not:
            anyOf:
              - required: [typedAnswer]
              - required: [matches]
        - required: [typedAnswer]
          not:
            anyOf:
              - required: [selectedOptionId]
              - required: [matches]
        - required: [matches]
          not:
            anyOf:
              - required: [selectedOptionId]
              - required: [typedAnswer]
      properties:
        submissionId:
          $ref: "#/components/schemas/Id"
        questionRevisionId:
          $ref: "#/components/schemas/Id"
        selectedOptionId:
          $ref: "#/components/schemas/Id"
        typedAnswer:
          type: string
          minLength: 1
          maxLength: 500
          writeOnly: true
          x-kelimio-sensitive: true
        matches:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: "#/components/schemas/MatchingSelection"
          writeOnly: true
          x-kelimio-sensitive: true
    AnswerRecordedResponse:
      type: object
      additionalProperties: false
      description: >-
        Post-commit feedback for exactly one submitted question. Multiple-choice
        responses contain correctOptionId; typed-cloze responses contain only
        the primary authored correctAnswerText; matching responses contain the
        complete correctMatches mapping. None appears before commit.
      x-kelimio-cross-field-invariants:
        - Exactly one of correctOptionId, correctAnswerText, and correctMatches is present.
        - correctMatches exactly covers the target and support item IDs issued for the submitted matching question.
      x-kelimio-redacted-to-string: true
      x-kelimio-redaction-test-answer-recorded-response: true
      required:
