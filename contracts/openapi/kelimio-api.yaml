        creates one real MOBILE_AUTHORING change set from the exact active release,
        revises one eligible typed-cloze prompt without returning authored text or
        answer material, and receives an unpublished immutable release. Publication
        and rollback still require the separate impact-bound release operations.
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocalCourseRevisionRequest"
      responses:
