            This can be earlier than the import session's uploadExpiresAt value.
        parts:
          type: array
          x-kelimio-sensitive: true
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/CourseImportPresignedPart"
    CourseImportPresignedPart:
      type: object
      additionalProperties: false
      x-kelimio-redacted-to-string: true
      x-kelimio-redacted-field-names: [url, requiredHeaders]
      required: [partNumber, sizeBytes, url, requiredHeaders]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 5
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        url:
          type: string
          x-kelimio-sensitive: true
          format: uri
          maxLength: 8192
        requiredHeaders:
          $ref: "#/components/schemas/CourseImportPartHeaders"
          x-kelimio-sensitive: true
    CourseImportPartHeaders:
      type: object
      additionalProperties: false
      x-kelimio-redacted-to-string: true
      x-kelimio-redacted-field-names: [sha256]
      required: [contentLength, sha256]
