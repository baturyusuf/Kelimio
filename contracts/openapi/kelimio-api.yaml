          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubsequentCourseDraftResult"
        "200":
          description: Existing authored release returned for an idempotent retry
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubsequentCourseDraftResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/development/courses/{courseId}/editor:
    get:
      operationId: getLocalCourseEditor
      tags: [Development]
      summary: Read the owner-scoped local course editor document
      description: >-
        Returns the first eligible typed-cloze prompt and its immutable hierarchy
        from the exact active release. The response is owner-scoped, no-store,
        answer-key-free, and carries the strong ETag required by draft creation.
        It is unavailable outside explicitly enabled local/test environments.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Current editable document
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            ETag:
              description: Strong opaque version of the active release and editable question revision.
              schema:
                type: string
                pattern: '^"[0-9a-f]{64}"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalCourseEditorSnapshot"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/development/courses/{courseId}/editor/drafts:
    post:
      operationId: createLocalCourseEditorDraft
      tags: [Development]
      summary: Save one ETag-bound immutable local editor draft
      description: >-
        Creates a committed MOBILE_AUTHORING change set and an unpublished
        immutable release only when If-Match still names the current owner-scoped
        editor document. It accepts a changed typed-cloze prompt but no answer,
        score, entitlement, ownership, or publication assertion. Publication
        remains a separate impact-bound operation.
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocalCourseEditorDraftRequest"
      responses:
        "201":
          description: Editor draft created
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubsequentCourseDraftResult"
        "200":
          description: Existing editor draft returned for an idempotent retry
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubsequentCourseDraftResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token obtained with Authorization Code and PKCE.
  headers:
    RequestId:
      description: Correlation identifier generated or accepted by the API edge.
      schema:
        type: string
        format: uuid
    NoStore:
      description: Prevents sensitive answer feedback and owner-scoped import data from being cached.
      schema:
        type: string
        const: no-store
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag returned by the current owner-scoped editor document.
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
    Cursor:
      name: cursor
      in: query
      description: >-
        Opaque tamper-evident cursor bound to the authenticated owner, import,
        immutable preview/report identity, and position. It contains no
        workbook text or storage coordinates.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable UUID generated once for the logical command.
      schema:
        type: string
        format: uuid
    ClientCapabilities:
      name: X-Kelimio-Client-Capabilities
      in: header
      required: false
      description: >-
        Comma-separated bounded capability tokens implemented by the client.
        Missing means the empty set; this is a compatibility signal, not authorization.
      schema:
        type: string
        minLength: 1
        maxLength: 1040
        pattern: "^[a-z][a-z0-9]*(?:\\.[a-z][a-z0-9]*)+(?:, ?[a-z][a-z0-9]*(?:\\.[a-z][a-z0-9]*)+)*$"
  responses:
    Problem:
      description: RFC 9457 problem details
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Id:
      type: string
      format: uuid
    MatchingItemId:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: >-
        Independently generated random UUIDv4 for one public matching-side
        item. It is unrelated to text, authored pair identity, insertion
        order, the opposite-side item ID, or any shared namespace.
    QuestionPrompt:
      type: [string, "null"]
      description: >-
        Required question prompt value. MATCHING carries an explicit null;
        every other question type carries nonblank target-language text.
    LanguageTag:
      type: string
      description: >-
        Canonically cased BCP 47 subset: lowercase primary language, optional
        title-case script, uppercase region, and lowercase variants. Extensions
        and private-use subtags are outside the initial API contract.
      minLength: 2
      maxLength: 35
      pattern: "^[a-z]{2,8}(?:-[A-Z][a-z]{3})?(?:-(?:[A-Z]{2}|[0-9]{3}))?(?:-(?:[a-z0-9]{5,8}|[0-9][a-z0-9]{3}))*$"
      examples: [tr, en, ar, fr, pt-BR, zh-Hant]
    ClientCapability:
      type: string
      minLength: 3
      maxLength: 64
      pattern: "^[a-z][a-z0-9]*(?:\\.[a-z][a-z0-9]*)+$"
      examples: [question.matching.v1]
    MeResponse:
      type: object
      additionalProperties: false
      x-kelimio-cross-field-invariants:
        - REQUIRED means profileVersion is 0 and preferredSupportLanguage is absent or null.
        - COMPLETE means profileVersion is at least 1 and preferredSupportLanguage is non-null.
      required:
        - id
        - displayName
        - appLocale
        - activeTargetLanguage
        - timeZone
        - profileVersion
        - profileSetupStatus
      properties:
        id:
          $ref: "#/components/schemas/Id"
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        appLocale:
          $ref: "#/components/schemas/LanguageTag"
        activeTargetLanguage:
          $ref: "#/components/schemas/LanguageTag"
        preferredSupportLanguage:
          type: [string, "null"]
          description: Absent or null until first-login profile setup is complete.
          minLength: 2
          maxLength: 35
