    Sha256Hex:
      type: string
      pattern: "^[0-9a-f]{64}$"
    Sha256Base64:
      type: string
      minLength: 44
      maxLength: 44
      pattern: "^[A-Za-z0-9+/]{43}=$"
    CreateCourseImportRequest:
      type: object
      additionalProperties: false
      x-kelimio-redacted-to-string: true
      x-kelimio-redacted-field-names: [originalFileName, sourceSha256, parts]
      x-kelimio-redaction-test-course-import: true
      description: >-
        The part declarations must be consecutive from one, sum exactly to
        fileSizeBytes, use 5 MiB for every non-final part, and contain no more
        than five parts. The server initiates S3 multipart upload with SHA-256
        checksum validation selected. Each digest is computed before upload so
        its presigned part request and final multipart completion can bind the
        same checksum.
      x-kelimio-cross-field-invariants:
        - parts use consecutive partNumber values beginning at 1.
        - every non-final part has sizeBytes 5242880 and the final part has sizeBytes from 1 through 5242880.
        - the sum of part sizeBytes equals the top-level fileSizeBytes.
      required: [originalFileName, declaredMediaType, fileSizeBytes, sourceSha256, parts]
      properties:
        originalFileName:
          type: string
          x-kelimio-sensitive: true
          x-kelimio-normalization: NFC
          x-kelimio-reject-default-ignorable-code-points: true
          minLength: 6
          maxLength: 255
          pattern: '^(?!.*[\p{Cf}\u034f\u115f-\u1160\u17b4-\u17b5\u180b-\u180f\u2060-\u206f\u3164\ufe00-\ufe0f\uffa0\ufff0-\ufff8\u{1bca0}-\u{1bca3}\u{1d173}-\u{1d17a}\u{e0000}-\u{e0fff}])(?=\S)[^/:\\\u0000-\u001f\u007f-\u009f]{1,250}\.[xX][lL][sS][xX]$'
        declaredMediaType:
          type: string
          const: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        fileSizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 26214400
        sourceSha256:
          $ref: "#/components/schemas/Sha256Hex"
          x-kelimio-sensitive: true
        parts:
          type: array
          x-kelimio-sensitive: true
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/CourseImportPartDeclaration"
    CourseImportPartDeclaration:
      type: object
      additionalProperties: false
      x-kelimio-redacted-to-string: true
      x-kelimio-redacted-field-names: [sha256]
      required: [partNumber, sizeBytes, sha256]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 5
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        sha256:
          $ref: "#/components/schemas/Sha256Base64"
          x-kelimio-sensitive: true
    CourseImportUploadSessionResponse:
      type: object
      additionalProperties: false
      x-kelimio-redacted-to-string: true
      x-kelimio-redacted-field-names: [import, upload]
