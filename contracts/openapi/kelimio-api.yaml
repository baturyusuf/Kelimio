          maxLength: 500
          x-kelimio-sensitive: true
        correctMatches:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: "#/components/schemas/MatchingSelection"
          x-kelimio-sensitive: true
        activeScoreDelta:
          type: integer
          minimum: 0
          maximum: 60
        lifetimeScoreDelta:
          type: integer
          minimum: 0
          maximum: 60
        activeQuestionScore:
          type: integer
          minimum: 0
          maximum: 60
        lifetimeScore:
          type: integer
          minimum: 0
        energy:
          $ref: "#/components/schemas/EnergyResponse"
        attemptState:
