      type: object
      additionalProperties: false
      x-kelimio-redacted-to-string: true
      x-kelimio-redacted-field-names: [parts]
      required: [expiresAt, parts]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: >-
            Earliest exact expiry among the signed part-upload URLs in this
