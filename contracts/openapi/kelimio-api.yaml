        - lifetimeScore
        - energy
        - attemptState
      oneOf:
        - required: [correctOptionId]
          not:
            anyOf:
              - required: [correctAnswerText]
              - required: [correctMatches]
        - required: [correctAnswerText]
          not:
            anyOf:
              - required: [correctOptionId]
              - required: [correctMatches]
        - required: [correctMatches]
          not:
            anyOf:
              - required: [correctOptionId]
              - required: [correctAnswerText]
      properties:
        submissionId:
          $ref: "#/components/schemas/Id"
        correct:
          type: boolean
        correctOptionId:
          x-kelimio-sensitive: true
          allOf:
            - $ref: "#/components/schemas/Id"
        correctAnswerText:
          type: string
