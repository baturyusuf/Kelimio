spring:
  application:
    name: kelimio-api
  datasource:
    url: ${KELIMIO_DB_URL}
    username: ${KELIMIO_DB_USER}
    password: ${KELIMIO_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${KELIMIO_DB_MAX_POOL_SIZE:20}
      minimum-idle: ${KELIMIO_DB_MIN_IDLE:2}
      auto-commit: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jooq:
    sql-dialect: POSTGRES
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KELIMIO_OIDC_ISSUER}
          audiences: ${KELIMIO_OIDC_AUDIENCE}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
  metrics:
    tags:
      application: kelimio-api

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"
