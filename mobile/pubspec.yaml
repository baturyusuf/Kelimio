name: kelimio_mobile
description: Kelimio production mobile client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  crypto: 3.0.7
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_appauth: ^12.0.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  intl: any
  kelimio_api_client:
    path: packages/kelimio_api_client
  uuid: ^4.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  html: 0.15.6
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
